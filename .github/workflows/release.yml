name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    env:
      RELEASE_TAG: v0.0.${{ github.run_number }}
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, win-x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate SDK files
        shell: pwsh
        run: |
          foreach ($name in @('Everything32.dll', 'Everything64.dll', 'EverythingARM64.dll', 'LICENSE.txt')) {
            if (-not (Test-Path -LiteralPath "Assets/EverythingSdk/$name")) {
              throw "Missing Assets/EverythingSdk/$name in the pushed commit."
            }
          }
      - name: Publish
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          dotnet publish QuadPane.csproj --configuration Release --runtime '${{ matrix.rid }}' --self-contained true --output publish -p:Version=$version -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'publish/QuadPane.exe')) { throw 'Published executable is missing.' }
          if (-not (Test-Path -LiteralPath 'publish/Assets/EverythingSdk/LICENSE.txt')) { throw 'Everything SDK license is missing from the package.' }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path 'publish/*' -DestinationPath "dist/QuadPane-$($env:RELEASE_TAG)-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: QuadPane-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.0.${{ github.run_number }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: QuadPane-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum QuadPane-*.zip > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/QuadPane-*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/QuadPane-*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --generate-notes
          fi
