name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: QuadPane
    env:
      RELEASE_TAG: v0.0.${{ github.run_number }}
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, win-x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate SDK files
        shell: pwsh
        run: |
          foreach ($name in @('Everything32.dll', 'Everything64.dll', 'EverythingARM64.dll', 'LICENSE.txt')) {
            if (-not (Test-Path -LiteralPath "Assets/EverythingSdk/$name")) {
              throw "Missing Assets/EverythingSdk/$name in the pushed commit."
            }
          }
      - name: Publish
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          dotnet publish QuadPane.csproj --configuration Release --runtime '${{ matrix.rid }}' --self-contained true --output publish -p:Version=$version -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'publish/QuadPane.exe')) { throw 'Published executable is missing.' }
          if (-not (Test-Path -LiteralPath 'publish/Assets/EverythingSdk/LICENSE.txt')) { throw 'Everything SDK license is missing from the package.' }
      - name: Smoke test Git and search metadata
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          foreach ($argument in @('--check-git-status', '--check-search-result')) {
            $process = Start-Process -FilePath (Resolve-Path 'publish/QuadPane.exe') -ArgumentList $argument -WorkingDirectory (Get-Location).Path -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "$argument smoke test failed: $($process.ExitCode)" }
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path 'publish/*' -DestinationPath "dist/QuadPane-$($env:RELEASE_TAG)-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: QuadPane-${{ matrix.rid }}
          path: QuadPane/dist/*.zip
          if-no-files-found: error

  installer:
    name: Build Windows installer
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: QuadPane
    env:
      RELEASE_TAG: v0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QuadPane-win-x64
          path: QuadPane/installer-input
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package installer
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "installer-input/QuadPane-$env:RELEASE_TAG-win-x64.zip" -DestinationPath publish
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler is missing.' }
          & $iscc "/DAppVersion=$($env:RELEASE_TAG.Substring(1))" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "dist/QuadPane-$env:RELEASE_TAG-win-x64-setup.exe")) { throw 'Installer is missing.' }
      - uses: actions/upload-artifact@v4
        with:
          name: QuadPane-installer
          path: QuadPane/dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, installer]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.0.${{ github.run_number }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: QuadPane-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum QuadPane-*.zip QuadPane-*.exe > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/QuadPane-*.zip dist/QuadPane-*.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/QuadPane-*.zip dist/QuadPane-*.exe dist/SHA256SUMS.txt --target "$GITHUB_SHA" --generate-notes
          fi
