<!-- QuadPane logo: 4 panel trong một khối bo góc; ô trên-trái sáng = panel đang hoạt động -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B9BFF"/>
      <stop offset="1" stop-color="#5B4BE8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#shine)"/>
  <rect x="52"  y="52"  width="68" height="68" rx="14" fill="#FFFFFF"/>
  <rect x="136" y="52"  width="68" height="68" rx="14" fill="#FFFFFF" fill-opacity="0.45"/>
  <rect x="52"  y="136" width="68" height="68" rx="14" fill="#FFFFFF" fill-opacity="0.45"/>
  <rect x="136" y="136" width="68" height="68" rx="14" fill="#FFFFFF" fill-opacity="0.45"/>
</svg>
