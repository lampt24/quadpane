<!-- QuadPane: four glass tiles cut from one rounded square; the bright top-left tile is the active pane. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE6FF"/>
      <stop offset="1" stop-color="#22B2EE"/>
    </linearGradient>
    <clipPath id="shape">
      <rect x="16" y="16" width="224" height="224" rx="58"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect x="16" y="16" width="106" height="106" rx="12" fill="url(#active)"/>
    <rect x="134" y="16" width="106" height="106" rx="12" fill="#3B8EE6"/>
    <rect x="16" y="134" width="106" height="106" rx="12" fill="#2C70CF"/>
    <rect x="134" y="134" width="106" height="106" rx="12" fill="#1E53A6"/>
  </g>
</svg>
